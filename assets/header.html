<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=820" />
  <title>micrographic-skill header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #f4f2ee;
      --color-ink: #0a0a0a;
      --color-border: #c8c4be;
      --color-mid: #888888;
      --color-faint: #bbbbbb;
      --color-white: #fafafa;
      --color-accent: #cc2200;
      --text-micro: 7px;
      --text-xs: 8px;
      --text-sm: 10px;
      --font-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --plate-w: 820px;
      --plate-h: 300px;
      --poster-w: 312px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e0deda;
      display: flex;
      justify-content: center;
      padding: 24px;
      font-family: var(--font-cond);
    }

    .header-plate {
      width: var(--plate-w);
      height: var(--plate-h);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      position: relative;
      overflow: hidden;
      color: var(--color-ink);
    }

    .reg {
      position: absolute;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-faint);
      letter-spacing: 0.08em;
      z-index: 3;
    }
    .reg--tl { top: 2px; left: 8px; }
    .reg--tr { top: 2px; right: 8px; }
    .reg--bl { bottom: 38px; left: 8px; }
    .reg--br { bottom: 38px; right: 8px; }

    .zone-label {
      position: absolute;
      top: 18px;
      font-family: var(--font-mono);
      font-size: var(--text-micro);
      color: var(--color-faint);
      letter-spacing: 0.1em;
    }
    .zone-label--poster { left: 14px; }
    .zone-label--index { left: calc(var(--poster-w) + 14px); }
    .zone-label--center { left: 50%; transform: translateX(-50%); }

    .meta-strip {
      height: 32px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
    }

    .chip {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid var(--color-border);
      color: var(--color-mid);
      line-height: 1.3;
    }
    .chip--pkg { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-white); font-weight: 700; }
    .chip--accent { border-color: var(--color-accent); color: var(--color-accent); }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 45%, transparent);
    }

    .meta-strip__title {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 600;
    }

    .meta-strip__ref {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--text-micro);
      color: var(--color-faint);
    }

    .main {
      display: grid;
      grid-template-columns: var(--poster-w) 1fr;
      height: 186px;
    }

    .poster {
      border-right: 1px solid var(--color-border);
      padding: 10px 14px;
      position: relative;
      background-image: radial-gradient(circle, rgba(26, 26, 26, 0.12) 0.6px, transparent 0.6px);
      background-size: 5px 5px;
    }

    .bracket {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 10px;
      height: 10px;
      border-top: 1.5px solid var(--color-accent);
      border-left: 1.5px solid var(--color-accent);
    }

    .display-poster {
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      /* font-size set from header-data.json display.fontSizePx */
    }
    .display-poster__line { display: block; }
    .display-poster__plus {
      display: block;
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--color-mid);
      margin: 2px 0;
    }

    .hud-box {
      margin-top: 8px;
      border: 1px solid var(--color-accent);
      padding: 6px 8px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1.35;
    }

    .poster-chips { display: flex; gap: 6px; margin-top: 10px; }
    .token-row {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: var(--text-micro);
      color: var(--color-faint);
    }
    .token-row strong { color: var(--color-accent); font-weight: 600; }

    .manifest { padding: 10px 14px; font-size: var(--text-xs); }
    .manifest__label {
      font-size: var(--text-micro);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--color-faint);
      margin: 6px 0 2px;
    }
    .manifest__rule { height: 1px; background: var(--color-border); margin-bottom: 4px; }

    .cycle-line {
      min-height: 14px;
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--color-mid);
    }
    .cycle-line--principle {
      font-size: 9px;
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: 0.1em;
    }

    .data-row {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 6px;
      font-size: var(--text-micro);
      line-height: 1.4;
    }
    .data-row dt { font-weight: 600; letter-spacing: 0.1em; color: var(--color-mid); }
    .data-row dd { font-family: var(--font-mono); color: var(--color-ink); word-break: break-all; }

    .agent-row {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 6px;
      align-items: center;
      font-size: var(--text-micro);
      line-height: 1.5;
    }
    .agent-row__sq { width: 5px; height: 5px; background: var(--color-ink); }

    .serial {
      border-top: 1px solid var(--color-border);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: var(--text-micro);
      color: var(--color-faint);
      letter-spacing: 0.12em;
      white-space: nowrap;
      overflow: hidden;
    }

    .footer-chips {
      display: flex;
      gap: 4px;
      padding: 6px 10px;
      border-top: 1px solid var(--color-border);
    }

    .annotation-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px 6px;
      font-family: var(--font-mono);
      font-size: var(--text-micro);
      color: var(--color-mid);
      letter-spacing: 0.06em;
    }
    .anno-bracket {
      width: 16px;
      height: 1px;
      background: var(--color-ink);
      position: relative;
    }
    .anno-bracket::before, .anno-bracket::after {
      content: "";
      position: absolute;
      top: -2px;
      width: 1px;
      height: 5px;
      background: var(--color-ink);
    }
    .anno-bracket::before { left: 0; }
    .anno-bracket::after { right: 0; }
    .anno-circle {
      width: 6px;
      height: 6px;
      border: 1px solid var(--color-ink);
      border-radius: 50%;
      position: relative;
    }
    .anno-circle::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 2px;
      height: 2px;
      background: var(--color-mid);
      border-radius: 50%;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: var(--color-ink);
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--color-white);
    }
    .terminal-bar__prompt { color: var(--color-accent); margin-right: 6px; }
    .terminal-bar__sku { margin-left: auto; color: var(--color-mid); font-size: var(--text-micro); }
  </style>
</head>
<body>
  <article class="header-plate" aria-label="micrographic-skill README header">
    <span class="reg reg--tl">+ HDR</span>
    <span class="reg reg--tr">PLT +</span>
    <span class="reg reg--bl">+ A01</span>
    <span class="reg reg--br">B01 +</span>
    <span class="zone-label zone-label--poster">A01-POSTER</span>
    <span class="zone-label zone-label--index">B01-INDEX</span>
    <span class="zone-label zone-label--center" id="plate-dim">README PLATE · 820×300</span>

    <header class="meta-strip">
      <span class="chip chip--pkg">PKG HEADER</span>
      <span class="status-dot" aria-hidden="true"></span>
      <span class="meta-strip__title" id="pkg-title"></span>
      <span class="chip chip--accent">REGISTRY</span>
      <span class="meta-strip__ref" id="ref-line"></span>
    </header>

    <div class="main">
      <section class="poster">
        <span class="bracket" aria-hidden="true"></span>
        <h1 class="display-poster" id="display-poster"></h1>
        <div class="hud-box" id="tagline"></div>
        <div class="poster-chips" id="poster-chips"></div>
        <div class="token-row" id="token-row"></div>
      </section>

      <aside class="manifest">
        <p class="manifest__label">TRIGGER / CYCLE</p>
        <div class="manifest__rule"></div>
        <p class="cycle-line" id="trigger" aria-live="polite"></p>
        <p class="manifest__label">PRINCIPLE</p>
        <div class="manifest__rule"></div>
        <p class="cycle-line cycle-line--principle" id="principle" aria-live="polite"></p>
        <p class="manifest__label">PACKAGE</p>
        <div class="manifest__rule"></div>
        <dl id="manifest-table"></dl>
        <p class="manifest__label">AGENTS</p>
        <div class="manifest__rule"></div>
        <div id="agents"></div>
      </aside>
    </div>

    <div class="serial" id="serial" aria-hidden="true"></div>
    <div class="footer-chips" id="footer-chips"></div>
    <div class="annotation-row" aria-hidden="true">
      <div class="anno-bracket"></div>
      <div class="anno-circle"></div>
      <span id="annotation"></span>
      <div class="anno-circle"></div>
      <div class="anno-bracket"></div>
    </div>
    <div class="terminal-bar">
      <span class="terminal-bar__prompt">$</span>
      <span id="npx-cmd"></span>
      <span class="terminal-bar__sku" id="sku-line"></span>
    </div>
  </article>

  <script type="module">
    const POSTER_W = 312;
    const DISPLAY_CHAR_RATIO = 0.58;
    const DISPLAY_AUTO_MIN_PX = 48;
    const DISPLAY_AUTO_MAX_PX = 56;
    const DISPLAY_OVERRIDE_MIN_PX = 40;
    const DISPLAY_OVERRIDE_MAX_PX = 64;

    function resolveDisplayFontSize(display) {
      const lines = display.lines ?? [];
      const longestChars = Math.max(...lines.map((l) => String(l).length));
      const fitPx = (POSTER_W - 28) / (longestChars * DISPLAY_CHAR_RATIO);
      const autoPx = Math.min(
        DISPLAY_AUTO_MAX_PX,
        Math.max(DISPLAY_AUTO_MIN_PX, Math.floor(fitPx))
      );
      if (display.fontSizePx == null || display.fontSizePx === "") return autoPx;
      const raw = Number(display.fontSizePx);
      if (!Number.isFinite(raw)) return autoPx;
      return Math.min(
        DISPLAY_OVERRIDE_MAX_PX,
        Math.max(DISPLAY_OVERRIDE_MIN_PX, Math.round(raw))
      );
    }

    const data = await fetch("./header-data.json").then((r) => r.json());
    const pkg = await fetch("../package.json").then((r) => r.json()).catch(() => ({ version: "1.1.0", name: "micrographic-skill" }));
    const year = new Date().getFullYear();
    const displayPx = resolveDisplayFontSize(data.display);

    const poster = document.getElementById("display-poster");
    poster.style.fontSize = `${displayPx}px`;
    const [line1, line2, line3] = data.display.lines;
    for (const line of [line1, line2]) {
      const span = document.createElement("span");
      span.className = "display-poster__line";
      span.textContent = line;
      poster.appendChild(span);
    }
    if (data.display.plus) {
      const plus = document.createElement("span");
      plus.className = "display-poster__plus";
      plus.textContent = "+";
      plus.setAttribute("aria-hidden", "true");
      poster.appendChild(plus);
    }
    const line3El = document.createElement("span");
    line3El.className = "display-poster__line";
    line3El.textContent = line3;
    poster.appendChild(line3El);

    document.getElementById("pkg-title").textContent = `${pkg.name}@${pkg.version}`;
    document.getElementById("ref-line").textContent = `${data.ref} · ${data.rev} · ${year}`;
    document.getElementById("tagline").textContent = data.tagline;
    document.getElementById("npx-cmd").textContent = data.npx;
    document.getElementById("sku-line").textContent = `${data.sku} · v${pkg.version}`;
    document.getElementById("annotation").textContent = data.annotation ?? "OPEN SOURCE";

    (data.posterChips ?? []).forEach((label) => {
      const chip = document.createElement("span");
      chip.className = `chip${label === "NPM" ? " chip--accent" : ""}`;
      chip.textContent = label;
      document.getElementById("poster-chips").appendChild(chip);
    });

    (data.footerChips ?? []).forEach((label) => {
      const chip = document.createElement("span");
      chip.className = `chip${label === "PUBLISHED" ? " chip--pkg" : label === "DESIGN SYSTEM" ? " chip--accent" : ""}`;
      chip.textContent = label;
      document.getElementById("footer-chips").appendChild(chip);
    });

    data.tokens.forEach((t) => {
      const span = document.createElement("span");
      const value = t.label === "DISPLAY" ? `${displayPx}px` : t.value;
      span.innerHTML = `${t.label} <strong>${value}</strong>`;
      document.getElementById("token-row").appendChild(span);
    });

    const rows = [
      ["NAME", pkg.name],
      ["VERSION", pkg.version],
      ["LICENSE", pkg.license ?? "MIT"],
      ["NODE", pkg.engines?.node ?? ">=18"],
      ["REGISTRY", (pkg.repository?.url ?? "").replace(/^git\+https?:\/\//, "").replace(/\.git$/, "")],
    ];
    const table = document.getElementById("manifest-table");
    rows.forEach(([k, v]) => {
      const row = document.createElement("div");
      row.className = "data-row";
      row.innerHTML = `<dt>${k}</dt><dd>${v}</dd>`;
      table.appendChild(row);
    });

    const agentsEl = document.getElementById("agents");
    data.agents.slice(0, 3).forEach((agent) => {
      const a = typeof agent === "string" ? { name: agent, path: "" } : agent;
      const row = document.createElement("div");
      row.className = "agent-row";
      row.innerHTML = `<span class="agent-row__sq"></span><span>${a.name}</span><span style="font-family:var(--font-mono);color:var(--color-mid)">${a.path}</span>`;
      agentsEl.appendChild(row);
    });

    document.getElementById("serial").textContent = Array.from({ length: 20 }, (_, i) =>
      String(i).padStart(4, "0")
    ).join(" · ");

    const triggers = data.cycles.triggers;
    const principles = data.cycles.principles;
    const triggerEl = document.getElementById("trigger");
    const principleEl = document.getElementById("principle");
    let ti = 0;
    let pi = 0;
    triggerEl.textContent = triggers[0];
    principleEl.textContent = principles[0];
    setInterval(() => {
      ti = (ti + 1) % triggers.length;
      pi = (pi + 1) % principles.length;
      triggerEl.textContent = triggers[ti];
      principleEl.textContent = principles[pi];
    }, 2800);
  </script>
</body>
</html>
